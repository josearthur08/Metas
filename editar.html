<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffd6e5" />
    <title>Editar meta financeira</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="edit-page is-locked">
    <main class="app-shell">
      <section class="intro-column">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="character-duo">
          <img class="kitty-figure" src="images.png" alt="Imagem original da Hello Kitty" />
          <img class="touka-figure" src="do-you-all-think-touka-was-properly-utilized-in-the-story-v0-jekxpzed2uid1.webp" alt="Imagem original da Touka em preto e branco" />
        </div>
        <div class="love-icons" aria-hidden="true"><span>♡</span><span>♥</span><span>♡</span></div>
        <h1>Cada passo me deixa mais perto do amor da minha vida.</h1>
      </section>
      <section class="tracker-panel" aria-labelledby="page-title">
        <div class="access-area">
          <div class="panel-topline"><span>ACESSO RESTRITO</span></div>
          <p class="locked-message">Digite a senha para abrir sua área de edição.</p>
          <form class="access-box" id="access-form">
            <input id="access-pin" type="password" maxlength="32" placeholder="Senha" aria-label="Senha de acesso" />
            <button class="access-button" type="submit">ENTRAR</button>
          </form>
        </div>
        <div class="editor-content">
          <div class="panel-topline"><span>SUAS METAS</span><button class="reset-button" id="reset-button" type="button">NOVA META <span aria-hidden="true">＋</span></button></div>
          <div class="goals-list" id="goals-list" aria-label="Metas salvas"></div>
          <form id="goal-form" novalidate>
            <div class="field-group title-field"><label for="goal-title">O que você quer conquistar?</label><input id="goal-title" name="goal-title" type="text" placeholder="Ex.: Viagem para ver meu amor" maxlength="56" autocomplete="off" /></div>
            <div class="amount-grid">
              <div class="field-group"><label for="goal-target">Quanto você precisa?</label><div class="money-input"><span>R$</span><input id="goal-target" name="goal-target" inputmode="decimal" type="number" min="0" step="0.01" placeholder="0,00" /></div></div>
              <div class="field-group"><label for="goal-current">Quanto você já tem?</label><div class="money-input current-input"><span>R$</span><input id="goal-current" name="goal-current" inputmode="decimal" type="number" min="0" step="0.01" placeholder="0,00" /></div></div>
            </div>
            <button class="save-button" type="submit"><span id="save-label">Criar minha meta</span><span class="button-arrow" aria-hidden="true">→</span></button>
          </form>
          <div class="progress-area" id="progress-area" aria-live="polite">
            <div class="progress-heading"><div><p class="eyebrow">SEU PROGRESSO</p><h2 id="goal-name">Sua próxima conquista</h2></div><div class="percentage-wrap"><strong id="percentage">0%</strong><span>concluído</span></div></div>
            <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progresso da meta"><div class="progress-fill" id="progress-fill"></div></div>
            <div class="progress-footer"><span><strong id="current-display">R$ 0,00</strong> guardados</span><span>faltam <strong id="remaining-display">R$ 0,00</strong></span></div>
          </div>
          <button class="share-button" id="share-button" type="button">COPIAR LINK PÚBLICO <span aria-hidden="true">↗</span></button>
        </div>
      </section>
      <footer class="site-credit">Dono e desenvolvedor: <strong>José Arthur</strong></footer>
    </main>
    <div class="toast" id="toast" role="status"></div>
    <script src="script.js"></script>
  </body>
</html>
